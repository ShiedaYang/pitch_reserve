name: Windows and Linux
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PITCH_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Allow the installed Chromium to use its sandbox on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            browser=$(node --input-type=module -e "import {chromium} from 'playwright'; import {realpathSync} from 'node:fs'; process.stdout.write(realpathSync(chromium.executablePath()));")
            sudo tee /etc/apparmor.d/pitch-reserve-ci >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile pitch-reserve-ci "$browser" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/pitch-reserve-ci
          fi
      - name: Check sandboxed browser startup
        run: node --input-type=module -e "import {chromium} from 'playwright'; const browser = await chromium.launch({channel:'chromium',headless:true,chromiumSandbox:true}); await browser.close();"
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
